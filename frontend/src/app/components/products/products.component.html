<div class="products-container">
  <div class="products-header">
    <h1>
      <mat-icon>store</mat-icon>
      {{ pageTitle }}
    </h1>
    
    <div class="filters-section">
      <mat-form-field appearance="outline" class="sort-field">
        <mat-label>Ordenar por</mat-label>
        <mat-select [(ngModel)]="selectedSort" (selectionChange)="onSortChange()">
          <mat-option *ngFor="let option of sortOptions" [value]="option.value">
            {{ option.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <div *ngIf="loading" class="loading-container">
    <mat-spinner></mat-spinner>
    <p>Carregando produtos...</p>
  </div>

  <div *ngIf="!loading && products.length === 0" class="empty-state">
    <mat-icon>inventory_2</mat-icon>
    <p>Nenhum produto encontrado</p>
  </div>

  <div class="products-grid" *ngIf="!loading && products.length > 0">
    <app-product-card
      *ngFor="let product of products"
      [product]="product"
      (addToCart)="addToCart($event)"
      (viewDetails)="openProductDetail($event)">
    </app-product-card>
  </div>

  <mat-paginator
    *ngIf="!loading && products.length > 0"
    [length]="totalProducts"
    [pageSize]="pageSize"
    [pageSizeOptions]="[12, 24, 48]"
    (page)="onPageChange($event)"
    showFirstLastButtons
    class="products-paginator">
  </mat-paginator>
</div>
