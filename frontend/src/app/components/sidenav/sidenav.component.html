<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened="true" class="sidenav">
    <div class="sidenav-header">
      <h2>
        <mat-icon>store</mat-icon>
        Ecommerce
      </h2>
    </div>
    <mat-nav-list>
      <a mat-list-item (click)="goHome()" class="nav-item">
        <mat-icon>home</mat-icon>
        <span>Home</span>
      </a>
      <mat-divider *ngIf="isAdmin"></mat-divider>
      <h3 mat-subheader *ngIf="isAdmin">Administração</h3>
      <a mat-list-item *ngIf="isAdmin" (click)="router.navigate(['/admin/products'])" class="nav-item admin-link">
        <mat-icon>admin_panel_settings</mat-icon>
        <span>Gerenciar Produtos</span>
      </a>
      <a mat-list-item *ngIf="isAdmin" (click)="router.navigate(['/admin/products/new'])" class="nav-item admin-link">
        <mat-icon>add_box</mat-icon>
        <span>Novo Produto</span>
      </a>
      <a mat-list-item *ngIf="isAdmin" (click)="router.navigate(['/admin/categories/new'])" class="nav-item admin-link">
        <mat-icon>category</mat-icon>
        <span>Nova Categoria</span>
      </a>
      <mat-divider></mat-divider>
      <h3 mat-subheader>Categorias</h3>
      <a mat-list-item 
         *ngFor="let category of categories" 
         (click)="selectCategory(category.id)"
         class="nav-item">
        <mat-icon>{{ category.icon }}</mat-icon>
        <span>{{ category.name }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary" class="top-toolbar">
      <span>Ecommerce</span>
      <span class="spacer"></span>
      <button mat-icon-button [matBadge]="cartItemsCount" matBadgeColor="accent" (click)="goToCart()" matTooltip="Ver Carrinho">
        <mat-icon>shopping_cart</mat-icon>
      </button>
      <span class="user-info">{{ authService.getUser()?.name || authService.getUser()?.email }}</span>
      <button mat-icon-button (click)="logout()" matTooltip="Sair">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <div class="content-wrapper">
      <ng-content></ng-content>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
