<mat-card class="product-card" (click)="onCardClick()">
  <div class="image-container">
    <img [src]="getProductImage(product)" [alt]="product.name" class="product-image">
    <div class="overlay" *ngIf="showOverlay && !showQuantityInput">
      <button mat-fab color="primary" (click)="onViewDetails($event)" matTooltip="Ver Detalhes">
        <mat-icon>visibility</mat-icon>
      </button>
    </div>
  </div>
  
  <mat-card-header>
    <mat-card-title class="product-title">{{ product.name }}</mat-card-title>
    <mat-card-subtitle *ngIf="product.category_name" class="category">
      <mat-icon>{{ product.category_icon }}</mat-icon>
      {{ product.category_name }}
    </mat-card-subtitle>
  </mat-card-header>
  
  <mat-card-content>
    <p class="description">{{ product.description }}</p>
    <p class="price">R$ {{ formatPrice(product.price) }}</p>
  </mat-card-content>
  
  <mat-card-actions>
    <ng-container *ngIf="!showQuantityInput">
      <button mat-raised-button color="primary" (click)="onAddToCart($event)" class="add-button">
        <mat-icon>add_shopping_cart</mat-icon>
        Adicionar
      </button>
    </ng-container>
    
    <ng-container *ngIf="showQuantityInput">
      <div class="quantity-controls">
        <button mat-icon-button color="warn" (click)="cancelQuantity($event)" matTooltip="Cancelar">
          <mat-icon>close</mat-icon>
        </button>
        <button mat-icon-button (click)="decrementQuantity()" [disabled]="quantity <= 1">
          <mat-icon>remove</mat-icon>
        </button>
        <input 
          type="number" 
          class="quantity-input" 
          [(ngModel)]="quantity" 
          (ngModelChange)="validateQuantity()"
          min="1"
          (click)="$event.stopPropagation()"
          (keydown.enter)="onAddToCart($event)">
        <button mat-icon-button (click)="incrementQuantity()">
          <mat-icon>add</mat-icon>
        </button>
        <button mat-raised-button color="accent" (click)="onAddToCart($event)" class="confirm-btn">
          <mat-icon>check</mat-icon>
          OK
        </button>
      </div>
    </ng-container>
  </mat-card-actions>
</mat-card>
